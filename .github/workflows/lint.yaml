name: golangci-lint
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:        
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.27
    - name: Checkout code
      uses: actions/checkout@v7
    # golangci-lint has no release built with Go 1.27 yet, and it refuses to run
    # against a module targeting a newer Go than it was built with:
    #   "the Go language version (go1.26) used to build golangci-lint is lower
    #    than the targeted Go version (1.27.0)"
    # Kept non-blocking so CI stays meaningful; drop continue-on-error and bump
    # `version` once a Go 1.27 build ships.
    # See https://github.com/golangci/golangci-lint/issues/6643
    - name: golangci-lint
      continue-on-error: true
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.11.3
        args: --timeout=10m
