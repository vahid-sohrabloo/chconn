name: golangci-lint
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:        
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        # Pinned to 1.26 until golangci-lint ships a release built with Go 1.27.
        # A Go 1.26-built linter panics on a Go 1.27 stdlib:
        # "file requires newer Go version go1.27 (application built with go1.26)".
        # See https://github.com/golangci/golangci-lint/issues/6643
        go-version: 1.26
    - name: Checkout code
      uses: actions/checkout@v7
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.11.3
        args: --timeout=10m
